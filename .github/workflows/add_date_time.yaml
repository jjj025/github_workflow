name: Add data

on:
  pull_request:
    types: [labeled]
    
permissions:
  contents: write
  pull-requests: write

jobs:
  add_data:
    if: ${{github.event.label.name == 'bootstrap'}}
    runs-on: [self-hosted]
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "PR_NUMBER=${PR_NUMBER}" >> test.txt
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test.txt
          git commit -m "Add PR number to test.txt"
          git push origin HEAD:${{ github.head_ref }}
